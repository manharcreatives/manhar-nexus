name: provision-cron

# Safety net for "paid but the restaurant account was not created yet". Vercel's own cron runs only once a day on
# the Hobby plan, so this calls the same route every 10 minutes. It is idempotent: the route resumes only accounts
# that are paid and not yet created, a few per call.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      the production origin, e.g. https://manhar-nexus.vercel.app (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
# When either is missing the job skips cleanly instead of failing.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: provision-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the provisioning cron route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL must start with https:// (the secret is sent in a header)"; exit 1 ;;
          esac
          status=$(curl --silent --show-error --max-time 90 --output /tmp/body.txt --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/internal/cron/provision")
          echo "HTTP ${status}"
          # The body lists only counts and outcomes (never secrets), so it is safe to print.
          head -c 500 /tmp/body.txt || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error::provisioning cron answered ${status}"
            exit 1
          fi
