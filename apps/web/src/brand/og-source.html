  .tear { border-top: 2px dashed rgb(255 255 255 / 0.14); margin: 22px -30px 18px; }

  .row i { flex: 1; border-bottom: 2px dotted rgb(255 255 255 / 0.18); transform: translateY(-4px); }
  .row u { text-decoration: none; font-variant-numeric: tabular-nums; color: var(--muted); }
  .total { position: absolute; left: 30px; right: 30px; bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end; }
  .total small { font: 700 12px "Satoshi"; letter-spacing: .14em; color: var(--muted); }
  .total div { font: 600 54px/1 "Clash Display"; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; border-bottom: 3px double rgb(255 255 255 / 0.2); padding-bottom: 6px; text-shadow: 0 0 30px rgb(34 197 94 / 0.45); }
